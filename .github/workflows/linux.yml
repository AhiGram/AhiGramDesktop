name: Linux

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tagname:
        description: 'Tag name'
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ahigram:build

    steps:
      - name: Set TAGNAME
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGNAME="${{ github.event.inputs.tagname || github.ref_name }}"
          else
            TAGNAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAGNAME=$TAGNAME" >> $GITHUB_ENV

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Pull Docker image
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env
          docker tag ghcr.io/telegramdesktop/tdesktop/centos_env $IMAGE_TAG

      - name: Build
        run: |
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          $IMAGE_TAG \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_INSTALL_PREFIX="/usr" \
          -D TDESKTOP_API_ID=${{ secrets.API_ID }} \
          -D TDESKTOP_API_HASH=${{ secrets.API_HASH }}

      - name: Create archive
        run: |
          cd out/install
          tar -I 'zstd -T0 --ultra -22' -cvf ahigram-${{ env.TAGNAME }}-linux.tar.zst usr

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AhiGram-linux-${{ env.TAGNAME }}
          path: out/install/ahigram-${{ env.TAGNAME }}-linux.tar.zst
